[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-raman-analysis"
version = "0.1.0"
description = "Traceable silicon Raman peak analysis and uncertainty diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Morad Atabrahim"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "matplotlib>=3.8"]

[project.scripts]
raman-analyze = "raman_analysis.cli:main"

[project.urls]
Repository = "https://github.com/Atabrahim/semiconductor-raman-analysis"
Issues = "https://github.com/Atabrahim/semiconductor-raman-analysis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
