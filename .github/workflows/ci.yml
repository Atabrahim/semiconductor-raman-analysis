name: Scientific validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel and test tools
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])"
      - name: Verify dependencies and formatting
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
      - name: Test the installed package
        run: python -m pytest -q
      - name: Verify installed API outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "import raman_analysis; from raman_analysis import read_spectrum, fit_peak; spectrum = read_spectrum(r'${{ github.workspace }}/data/silicon_raw.txt'); fit = fit_peak(spectrum); assert abs(fit.center_cm1 - 520.515353) < 1e-5; assert 'site-packages' in raman_analysis.__file__; print(raman_analysis.__file__)"
      - name: Verify installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          raman-analyze --version
          python -m raman_analysis --version
          raman-analyze "${{ github.workspace }}/data/silicon_raw.txt" --config "${{ github.workspace }}/examples/silicon.json" --metadata "${{ github.workspace }}/data/provenance.json" --output cli-report --bootstrap 200 --block-size 5 --plots
      - name: Reproduce measured and synthetic results
        run: python examples/reproduce.py --output outputs/ci-reproduced
